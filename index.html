 ждал именно тебя. «Слышал, ты ищешь ключ, который сам выбирает замок? — спрашивает он. — Тогда загадка первая: что можно выковать, но нельзя купить?» На наковальне лежит тёплый ключ. По его зубцам бегут искры, будто внутри спрятан маленький костёр. За спиной никого нет, но на пыльном полу появляется новый след. Кто-то очень маленький уже проверил дорогу.`,school:`Кузница датируется последней четвертью XVIII века: именно тогда усадьба перешла к роду Еремеевых. Мастер Еремей встречает экспедицию у горна и сразу предупреждает: здесь важно не только найти ключ, но и прочитать клеймо. «На наковальне три знака, — говорит он. — Два принадлежат людям, третий — месту». Историческая пасхалка: точно такой же знак встречается в описи 1786 года рядом с записью о подземном ходе. Ключ на наковальне нагрет, хотя огонь погас час назад. На полу — цепочка маленьких следов, ведущих к гроту. Первая гипотеза команды: кто-то уже начал маршрут раньше вас.`,adult:`Кузница пахнет железом и временем. Еремей не поднимает глаз от наковальни, пока не заканчивает удар: размеренный, точный, будто выбивающий годы. «Ключ? — переспрашивает он. — У меня их было три. Один открыл грот, второй — подклет, а третий я бросил в пруд, когда понял, что дверь за ним не затворяется». На стене висят клещи и молотки, не тронутые ржавчиной. Один молоток слишком мал для взрослой руки. Еремей замечает ваш взгляд: «Это для того, кто придёт после. У каждой вещи в усадьбе есть наследник — даже у страха». За дверью тихо звенит вода.`},grotto:{family:`Тропа ныряет под сень старых лип и выводит к каменному гроту. В пруду отражается небо, но отражение почему-то дрожит, хотя ветра нет. Из-за камня выходит берегиня Марфа. В её кокошнике горит маленький фонарь, а в руках — венок из камыша. «Я не пугаю, — говорит она. — Я проверяю, кто пришёл: гость или хозяин. Назови три вещи, которые вода умеет хранить». На поверхности пруда всплывает медный оберег. Рядом с ним — круги, будто кто-то только что нырнул. Но вода остаётся гладкой.`,school:`Перед вами искусственный грот конца XVIII века, сложенный из местного известняка. Берегиня Марфа — героиня локальных преданий, связанных с прудом и старым водостоком. «Вода здесь не стоячая, — поясняет она. — Под гротом проходит подземный ручей, и после дождей он поднимает со дна вещи, которым место в архиве». На камне видна медная пластина с датой 1786 и знаком, совпадающим с клеймом из кузницы. В отражении пруда на миг появляется арка подземного хода. Это не мистика: в описи усадьбы действительно упомянут «подклет, что ходит к реке».`,adult:`Грот встречает холодом и капелью. Вода в пруду стоит неподвижно, как тёмное стекло, и всё же где-то под ней слышится ровный низкий гул. Марфа выходит из тени беззвучно; фонарь в её руке освещает не лицо, а воду. «Память — плохой кладовщик, — говорит она. — Она отдаёт не то, что просишь, а то, что готов принять». На дне медленно проступает медный оберег. Чем дольше вы смотрите, тем отчётливее понимаете: в отражении стоит не ваша фигура. Или это и есть вы — тот, кем вы были триста лет назад?`},merchant:{family:`В старой оранжерее пахнет сушёными яблоками и воском. За конторкой сидит купец Афанасий и щёлкает крышкой карманных часов. «Товар — это то, что можно продать, — говорит он. — А сокровище — то, что после продажи остаётся у тебя в сердце. Угадай, чем я торгую?» На столе лежит дорожная печать и раскрытая книга, где одна и та же страница записана дважды. Афанасий подмигивает: «Один раз — для хозяина, другой — для совести». Под часами спрятана маленькая золотая монета. На ней стёрт профиль, но остался след пальца.`,school:`Оранжерея служила не только зимним садом: в конце XVIII века здесь размещалась конторка управляющего. Купец Афанасий, по архивным данным, вёл торговлю с северными гостями и поставлял в усадьбу медь. «Смотрите на запись, — говорит он. — В ведомости один и тот же подземный ход проведён дважды: как погреб и как коридор к реке». Такое расхождение часто возникало при перестройке зданий. Но вторая запись сделана другой рукой и чернилами более позднего состава. Печать на столе имеет дефект: одна буква в имени перевёрнута. Это редкая ошибка штемпеля или намеренная метка?`,adult:`Оранжерея давно остыла, но запах яблок остался. Афанасий сидит в глубине, положив ладони на конторку, и его карманные часы идут назад. «Время — единственный товар, который нельзя вернуть, — говорит он. — Зато можно продать дважды: себе и наследникам». На странице, записанной дважды, одна строка стёрта до дыр. Афанасий замечает, куда вы смотрите: «Я записал правду дважды, потому что в первый раз в неё не поверил. Во второй — потому что не поверили люди». Он протягивает печать. На металле ещё тёплый отпечаток чужой руки.`},stone:{family:`За гротом начинается галерея, где каждый шаг отзывается звонким эхом. В темноте зажигаются руны — мягкие, как светлячки. Из мрамора выступает Дух камня: плечи из серых глыб, борода из прожилок, глаза — два тёплых янтаря. «Разбудил — значит, будем дружить, — гудит он. — Но сначала проверка: что тяжелее — камень или обещание?» В ответ на его смех с потолка сыплется немного пыли. В щели между плитами лежит кусочек угля с руническим знаком. Когда ты берёшь его, руны на стенах становятся ярче. Дух довольно вздыхает: «Ну вот, теперь ты — часть маршрута».`,school:`Мраморная галерея, по всей видимости, была техническим коридором усадьбы: её стены сложены из блоков местного мрамора с характерной слоистостью. Дух камня — персонификация карстовых процессов и старых горняцких поверий. «Ваши приборы видят трещины, я вижу швы, — говорит он. — На этом камне руны появились не случайно: их процарапали поверх более древней разметки». Подсветка выявляет на плите спираль и три насечки. Такая же спираль изображена на медном обереге из грота. Уголь в щели имеет необычно высокую плотность. Это может быть графит или след старой кузнечной работы.`,adult:`Галерея уходит вниз, и воздух становится плотнее. Мрамор здесь не белый, а пепельный, с прожилками, похожими на застывшие молнии. Дух камня не выходит — он проступает, как образ на фотобумаге. «Я не храню тайны, — говорит он. — Я их держу. Разница в том, что тайну можно отдать, а то, что держишь, приходится нести». На стене загораются руны. Одна из них повторяет клеймо кузнеца, другая — спираль на обереге. Третью вы не видели нигде. Дух смеётся: «Это твой знак. Осталось понять, что ты им подпишешь».`}},nr={mill:{family:`Мельница стоит на берегу так, будто вот-вот шагнёт в воду. Плотник Никифор выходит на крыльцо, вытирает стружку с ладоней и стучит по перилам: «Слышишь? Дерево отвечает. Оно гвоздей не любит, зато помнит каждое имя, которое ему сказали». На крыле мельницы вырезана птица-берегиня. Если обойти её против солнца, птица будто провожает тебя взглядом. Под нижним венцом спрятана берестяная печать с мягким тиснением. «Это пропуск в старую сказку, — улыбается Никифор. — Но сначала ответь: что строят без единого гвоздя, а потом сорок лет не могут разобрать?»`,school:`Мельница собрана без гвоздей, на врубках и деревянных нагелях, — редкий пример северного плотницкого мастерства. Никифор встречает группу у входа и обращает внимание на резную птицу-берегиню: такой мотив встречается на обетных крестах и наличниках XV–XVII веков. «Птица смотрит туда, откуда приходит беда, — говорит он. — Или гость. Иногда это одно и то же». На нижнем венце исследователи находят берестяную печать с геометрическим орнаментом. Внутри — оттиск не буквы, а родового знака. Похожий знак указан в переписной книге погоста. Это делает мельницу не просто постройкой, а архивом в миниатюре.`,adult:`Мельница скрипит даже в безветрие. Никифор сидит на ступенях и строгает доску — медленно, будто разговаривает с деревом. «Каждый дом держится на памяти, — говорит он. — Вынете память — останутся брёвна. Крепкие, да пустые». На крыле вырезана птица-берегиня, её глаз вытерт до блеска: за триста лет к нему прикасались тысячи раз. Ниже, под венцом, лежит берестяная печать. Никифор не смотрит, когда вы её берёте. «Я знал, что кто-нибудь придёт. Не знал, что это будете вы». За его спиной мельничное колесо делает полный оборот — хотя вода в реке стоит.`},chapel:{family:`На трёх тропах стоит маленькая часовня, а рядом — рябина, которую не трогают ни птицы, ни мороз. Из-за неё выходит Северная Берегиня в тёплом платке и с фонарём в форме звезды. «Здесь дороги встречаются, чтобы люди не терялись, — говорит она. — Но одна тропа всегда лишняя. Найдёшь её — поймёшь, куда идти». На ветке рябины висит обетная лента с тремя узелками. Если отпустить её на ветер, она не падает, а тянется в сторону рощи. Берегиня кивает: «Вот и первый ответ. Только не забудь поблагодарить дорогу».`,school:`Часовня на трёх тропах — характерный элемент северного погоста: её ставили на перекрёстке дорог как обетный знак и ориентир. Северная Берегиня в местной традиции связана с культом водоёмов и дорог; её образ постепенно сблизился с христианской символикой. «Обетная лента — не украшение, а документ, — говорит она. — По узлам читали, кто и о чём просил». На ленте три узла разных типов. Один из них повторяется на счётной бирке из лавки. Это может указывать на торговый путь, проходивший через погост. Рябина у часовни действительно не даёт ягод птицам — возможно, из-за горечи особого сорта.`,adult:`Часовня стоит на развилке, где три тропы расходятся так уверенно, будто у каждой есть своя судьба. Берегиня появляется из сумрака с фонарём-звездой; свет падает только на её руки. «Люди думают, что выбирают дорогу, — говорит она. — Чаще дорога выбирает, кем ты вернёшься». На рябине висит обетная лента, выцветшая до цвета старой бумаги. Три узелка на ней завязаны не человеческими пальцами — слишком тонко. Берегиня протягивает фонарь: «Посвети на третью тропу. Но если увидишь там себя, не оборачивайся. Это не гость, это память».`},shop:{family:`У пристани пахнет смолой и тёплым хлебом. В лавке купец Влас пересчитывает бирки и что-то бормочет себе под нос. «Считать — наука простая, — говорит он. — Сначала считай дорогу, потом товар, а деньги сами сойдутся. Хочешь фокус?» Он кладёт на прилавок деревянную бирку с тремя зарубками. «Одна — за соль, другая — за мех, третья — за секрет. Угадаешь, какая за секрет, — получишь подсказку». Снаружи скрипит причал. На секунду кажется, что кто-то ждёт лодку, которой нет уже двести лет.`,school:`Лавка у пристани была узловым пунктом торгового пути: здесь сходились речные и гужевые маршруты. Купец Влас показывает счётную бирку — прообраз товарного чека. «Зарубки наносили на две половины, — объясняет он. — Одну оставляли у продавца, другую у покупателя. Совпали — сделка состоялась». На бирке три группы насечек, и одна из них не совпадает с остальными по глубине. Возможно, она добавлена позже. В лавке сохранилась копия берестяной грамоты, где перечислены дани и имена. Одна строка процарапана поверх текста — это может быть позднейшая правка. Кто и зачем её внёс?`,adult:`В лавке темно, но Влас не зажигает огня. Он сидит среди пустых полок и перебирает деревянные бирки, как чётки. «Всё продаётся, — говорит он. — Вопрос лишь в том, что остаётся в цене». На прилавке лежит бирка с тремя зарубками. Две глубокие, третья едва заметна. «Это не счёт, это выбор, — усмехается Влас. — Первая — хлеб, вторая — мех, третья — имя. Что бы вы отдали, чтобы вас вспомнили?» За окном кто-то ждёт на пристани. Влас не оборачивается. «Не смотрите. Он приходит за теми, кто уже назвал цену».`},grove:{family:`Заповедная роща начинается сразу за околицей. Сосны здесь высокие, тихие, и каждая будто слушает. На поваленном стволе сидит Хранитель бора — мохнатый, с птичьим пером за ухом. «Не шуми, — говорит он. — Я считаю обещания. Триста двадцать одно уже выросло в дерево. Твоё будет следующим?» С ветки слетает деревянная птица-берегиня и садится тебе на ладонь. Она лёгкая, тёплая и пахнет смолой. Хранитель прищуривается: «Птица выбрала тебя. Значит, и роща выбрала. Теперь верни её к мельнице — и круг замкнётся».`,school:`Заповедная роща — участок коренного соснового бора, сохранившийся вокруг погоста. Хранитель бора — фольклорный образ, связанный с запретом на вырубку обетных деревьев. «Каждая сосна здесь старше вашей деревни, — говорит он. — Некоторые помнят, как закладывали мельницу. Деревянная птица — не игрушка: такие подвешивали к обетному кресту как знак исполненного обещания». На птице вырезан родовой знак, совпадающий с оттиском на берестяной печати. Это позволяет связать мельницу, часовню и рощу в единый обрядовый маршрут. Роща действительно сохранилась благодаря общинному запрету на рубку, а не случайно.`,adult:`Роща не шумит. Ветер входит в неё и замолкает, будто из уважения. Хранитель бора сидит на поваленном стволе, и мох на его плечах шевелится сам. «Здесь не место тайне, — говорит он. — Здесь место обещанию. Тайну можно забыть, обещание — нет». С ветки слетает деревянная птица-берегиня. Она садится вам на ладонь, и вы чувствуете, как в дереве бьётся что-то тёплое. «Её вырезал Никифор в год, когда родился сын, — говорит Хранитель. — Сын не вернулся с войны, а птица всё летает. Отнесите её к мельнице. Пусть круг закроется не так, как его начинали».`}},rr={adit:{family:`Вход в штольню похож на приоткрытую каменную дверь. Рудознатец Савва встречает тебя с фонарём и улыбкой: «Смелый гость — уже почти горняк. Только запомни: под землёй кричать нельзя, зато можно петь. Песню камень слушает лучше слов». На стене висят старые инструменты, а под ногами блестит медная монета. Савва поднимает её: «Видишь профиль? Это Хозяин медных жил. Он не любит жадных. Но с тем, кто пришёл с уважением, делится». Из глубины штольни тянет тёплым воздухом. Оттуда доносится тихий звон, будто кто-то перебирает монеты.`,school:`Штольня, по архивным данным, разрабатывалась с конца XVIII века. Рудознатец Савва показывает сохранившуюся крепь и объясняет, как читать горные выработки. «Вот эта жила дала первый медный блеск, — говорит он. — Но в ведомости её записали трижды: как медную, как серебряную и как «землю особого назначения». Такое расхождение — редкая архивная загадка». На полу находят медную монету с профилем, не совпадающим с известными образцами. Возможно, это местная отливка. Воздух из глубины тёплый даже зимой — признак подземного водоёма. Впереди слышен звук капели.`,adult:`Штольня дышит. Тёплый воздух выходит из неё ровно, как из груди спящего. Савва стоит у входа с фонарём, и его лицо кажется вырезанным из того же камня. «Я нашёл эту жилу в год, когда потерял брата, — говорит он. — Тогда думал: земля забрала одного, чтобы отдать другому. Теперь знаю: она ничего не отдаёт. Она разрешает взять». Под ногами блестит медная монета с профилем Хозяина. Савва не позволяет её поднять сразу. «Сначала посмотри вглубь. Видишь свет? Это озеро. Оно ждёт, чтобы кто-то назвал его по имени».`},lake:{family:`Подземное озеро светится изнутри мягким бирюзовым светом. Над водой стоит Хозяйка медных жил — в платье из каменных пластин и с гребнем из прозрачного кварца. «Я не топлю гостей, — говорит она. — Я проверяю, умеют ли они отпускать. Брось в воду что-нибудь, что тебе дорого, и посмотри, вернётся ли». По воде идут круги, но ни одна капля не падает с потолка. На камне у берега осталась спираль, будто нарисованная водой. Хозяйка улыбается: «Это карта. Только читать её надо не глазами, а памятью».`,school:`Подземное озеро — карстовая полость, заполненная водой. Хозяйка медных жил — персонаж горняцкого фольклора, связанный с представлениями о «духе месторождения». «Температура воды здесь постоянна, — говорит она. — А спираль на камне — след растворения известняка. Ваши учёные называют это карстовой воронкой, я называю это памятью воды». На стене видна спираль, совпадающая с руной на медной монете. Это может быть естественным образованием или древней разметкой. В воде отражается свет, источник которого не виден. Возможно, за озером есть вторая полость — и именно туда ведёт подземный ход.`,adult:`Озеро лежит внизу, как оброненное зеркало. Хозяйка медных жил стоит на камне, и её платье повторяет слои породы. «Вы пришли за камнем, — говорит она. — Все приходят за камнем. А потом оказывается, что камень пришёл за вами». Она просит бросить в воду самое дорогое. Вы разжимаете ладонь — и вода принимает это без всплеска. На мгновение в отражении появляется лицо Саввы. Хозяйка не оборачивается. «Он был здесь. Он всё ещё здесь. Вопрос не в том, как выйти. Вопрос в том, кого вы согласны оставить».`},office:{family:`В конторе приказчика пахнет чернилами и пылью. За столом сидит приказчик Фома и аккуратно переписывает одну и ту же строку в третий раз. «Ведомость — это не скука, — говорит он. — Это детектив, только вместо улик — цифры. Смотри: одна жила записана трижды. Как думаешь, почему?» На столе лежит медная монета и тройная ведомость. Фома пододвигает лупу: «Найди строку, которая врёт, — и получишь право спуститься дальше». За окном грохочет вагонетка. Она пустая, но колеса всё равно скрипят под тяжестью.`,school:`Контора приказчика — важный узел горнозаводского архива. Приказчик Фома демонстрирует тройную ведомость: одна и та же жила записана как медная, серебряная и «казённая». «Это не ошибка, — говорит он. — Это способ запутать проверку. Сравните даты и почерк». На монете и в ведомости повторяется один и тот же знак — возможно, личное клеймо рудознатца. Бумага имеет водяной знак местной фабрики, что позволяет датировать документ. В нижней строке стёрто имя. Если восстановить его, можно установить, кто на самом деле владел участком. Это уже не легенда, а историческое расследование.`,adult:`В конторе всё осталось так, будто приказчик вышел минуту назад. Фома сидит неподвижно, положив ладонь на тройную ведомость. «Я записывал одну жилу трижды, — говорит он. — В первый раз — как выгодную. Во второй — как безопасную. В третий — как свою». На страницах видны следы подчисток. Фома поднимает глаза: «Бумага терпит. Человек — нет». Он протягивает вам медную монету. На обороте — профиль, которого нет ни в одном каталоге. «Это не Хозяин, — тихо говорит Фома. — Это Савва. Он вернулся другим». За дверью снова скрипит пустая вагонетка.`},canyon:{family:`Мраморный каньон открывается внезапно: белые стены, бирюзовая вода и солнце, которое запуталось в камне. На краю стоит Хозяин медных жил — высокий, с короной из кристаллов и добрыми янтарными глазами. «Ты дошёл, — гудит он. — Значит, понял главное: сокровище не то, что в руках, а то, что после тебя осталось». В расщелине вспыхивает кристалл медной жилы. Хозяин протягивает его: «Возьми. Но помни: камень светится, только когда рядом есть тот, кто умеет видеть». В воде отражается всё небо целиком, хотя каньон глубокий.`,school:`Мраморный каньон — бывшая каменоломня, где добывали местный мрамор. Хозяин медных жил — персонификация горного массива и одновременно аллегория ответственного недропользования. «Смотрите на срез, — говорит он. — Каждая полоса — эпоха. Здесь был морской бассейн, потом горное поднятие, потом работа людей». Кристалл в расщелине образовался в трещине, заполненной минеральным раствором; его свечение объясняется преломлением света. На камне рядом выбит знак, совпадающий с клеймом из штольни. Маршрут замыкается: кузница, озеро и каньон связаны общей горнорудной историей.`,adult:`Каньон светится так, будто внутри камня кто-то зажёг солнце. Хозяин медных жил стоит на краю, и его корона из кристаллов звенит на ветру. «Все приходят за камнем, — говорит он. — Но камень — только память земли о том, что она умела до людей». В расщелине лежит кристалл медной жилы. Хозяин не отдаёт его сразу. «Савва спустился сюда за богатством. Ты спустишься за ответом. Разница в том, что ответ придётся унести с собой». Он смотрит в воду, и отражение каньона становится отражением города, которого здесь никогда не было.`}},ir=[{id:`manor`,label:`Усадьба XVIII века`,shortLabel:`Усадьба`,icon:`Castle`,tagline:`Липы, кузница и заговорённый ключ`,accent:`#DAA552`,archiveText:`В тени вековых лип стоит усадьба XVIII века, построенная на месте старого славянского городища. В конце парка дымит кузница мастера Еремея: здесь ковали ключи от каменного грота и обереги для всей округи. По преданию, один из ключей заговорили от лихих людей, и с тех пор он сам выбирает, кому открыться. В гроте у пруда слышали женский голос: берегиня Марфа хранит воды и память о тех, кто ушёл, не попрощавшись. В описи усадьбы 1786 года упомянуты купец Афанасий, торговавший с северными гостями, и подземный ход, который вёл к реке. Каменные стражи грота молчат, но на мраморе проступают руны, когда кто-то произносит имя старого мастера.`,curatedKeywords:[`усадьба XVIII века`,`мастер Еремей`,`берегиня Марфа`,`купец Афанасий`,`каменный грот`,`заговорённый ключ`],location:`Парк усадьбы «Липовая сень»`,duration:48,points:[{id:`forge`,title:`Кузница мастера Еремея`,place:`Кузница у липовой аллеи`,x:78,y:176,character:{name:`Еремей`,role:`кузнец и хранитель огня`,archetype:`blacksmith`,quote:`Огонь не врёт. Врёт тот, кто боится смотреть в него слишком долго.`,pitch:.72,rate:.92},artifact:{id:`manor-key`,name:`Заговорённый ключ Еремея`,type:`key`,material:`Кованое железо, медь, восковая заливка`,history:`Ключ выкован в усадебной кузнице в 1786 году. По описи он открывал не только грот, но и «дверь в подклете, что ходит к реке». Зубцы повторяют знак на наковальне — исследователи считают его личным клеймом мастеров Еремеевых.`,inscription:`КЛЮЧ · ОГОНЬ · ПАМЯТЬ`},scenes:tr.forge,choices:[{id:`a`,icon:`Search`,label:`Осмотреть тайное клеймо на наковальне`,response:`«Видишь три знака? — Еремей наклоняется ближе, и его голос становится тише. — Молот — моя работа, круг — хозяйская земля, а спираль — дверь. Клеймо ставили только на то, что нельзя потерять. Значит, ключ не потерян. Он ждёт, пока его назовут по имени». На наковальне вспыхивает золотая искра и падает ровно на зубцы ключа.`},{id:`b`,icon:`MessageCircleQuestion`,label:`Спросить кузнеца о подземном ходе`,response:`«Ход есть, — кивает Еремей. — Но он не под землёй, а под памятью. Сначала спустись в грот, потом найди купца Афанасия: он последний, кто видел дверь открытой. И запомни: внизу нельзя называть чужое имя. Только своё». Он снимает с гвоздя фонарь, но не отдаёт его, а ставит на порог — будто отмечает начало пути.`}]},{id:`grotto`,title:`Каменный грот у пруда`,place:`Грот и зеркальный пруд`,x:140,y:104,character:{name:`Марфа`,role:`берегиня воды и памяти`,archetype:`guardian`,quote:`Вода помнит каждый камень, которого коснулась. И каждого, кто ушёл.`,pitch:1.22,rate:.88},artifact:{id:`manor-amulet`,name:`Медный оберег берегини`,type:`amulet`,material:`Медь, речной жемчуг, синяя эмаль`,history:`Оберег найден у грота в 1974 году. На его обороте выцарапано слово «МАРФА» и волнообразный знак воды. Подобные украшения носили женщины, отвечавшие за ключи от подземных хранилищ и чистоту родников.`,inscription:`ВОДА · ОБЕРЕГ · ПАМЯТЬ`},scenes:tr.grotto,choices:[{id:`a`,icon:`Waves`,label:`Прислушаться к голосу за водой`,response:`Вы замираете. Из-за каменной кромки доносится тихое пение — не слова, а их тень. Марфа поднимает фонарь: «Это голос родника. Он повторяет имена тех, кого здесь помнят. Твоё имя пока молчит — значит, тебе ещё предстоит его оставить». На воде появляется золотая дорожка, ведущая к арке подземного хода.`},{id:`b`,icon:`Flame`,label:`Посветить фонарём в зеркало пруда`,response:`Луч фонаря скользит по воде и вдруг уходит вглубь, не отражаясь. «Осторожно, — говорит Марфа. — В этом пруду отражается не то, что есть, а то, что было. Видишь арку? Это подклет, о котором писал Афанасий. Вода показывает дорогу раз в году, и сегодня как раз тот вечер». Она вкладывает вам в ладонь медный оберег.`}]},{id:`merchant`,title:`Купеческая конторка`,place:`Оранжерея и старая конторка`,x:238,y:126,character:{name:`Афанасий`,role:`купец и составитель описей`,archetype:`merchant`,quote:`У всякой вещи есть цена. У памяти цена другая — её платят не деньгами.`,pitch:.86,rate:.94},artifact:{id:`manor-seal`,name:`Дорожная печать Афанасия`,type:`seal`,material:`Бронза, горный хрусталь, кожаный шнур`,history:`Личная печать купца Афанасия, торговавшего с северными гостями. Оттиск с этой печати найден на описи 1786 года. Одна буква в имени перевёрнута — либо ошибка штемпеля, либо тайный знак для своих.`,inscription:`АФАНАСИЙ · ДОРОГА · ДОГОВОР`},scenes:tr.merchant,choices:[{id:`a`,icon:`BookOpen`,label:`Открыть конторскую книгу на закладке`,response:`На закладке — список вещей, которых нет в описи. Последняя строка записана другими чернилами: «ключ от подклета — вернуть воде». Афанасий закрывает книгу ладонью. «Это не торговля, это долг. Хозяин усадьбы велел забыть, а я записал дважды. Теперь ты знаешь, кому ключ на самом деле принадлежит». Он снимает с шеи печать и кладёт её рядом с вашей рукой.`},{id:`b`,icon:`Coins`,label:`Спросить о цене старого ключа`,response:`Афанасий долго молчит, потом щёлкает крышкой часов. «Цену? Я бы отдал за него всё, что у меня есть. И знаешь, что страшнее? Однажды я так и сделал». Он указывает на печать: «Возьми. Печать откроет конторку, а конторка — правду. Только не пытайся продать правду обратно. Она не принимает возврат».`}]},{id:`stone`,title:`Подземный ход и дух камня`,place:`Мраморная галерея`,x:292,y:54,character:{name:`Дух камня`,role:`древний хранитель галереи`,archetype:`spirit`,quote:`Я молчал триста лет. Скажи мне слово, которое стоит разбудить камень.`,pitch:.55,rate:.78},artifact:{id:`manor-rune`,name:`Рунический уголь`,type:`rune`,material:`Графит, кварцевая крошка, воск`,history:`Кусок угля с руническим знаком, найденный в галерее. Знак повторяет спираль с наковальни и оберега. Считается, что им отмечали начало подземного хода, чтобы вернувшийся мог найти дорогу назад.`,inscription:`СПИРАЛЬ · ДОРОГА · ВОЗВРАЩЕНИЕ`},scenes:tr.stone,choices:[{id:`a`,icon:`Flame`,label:`Произнести имя мастера над рунами`,response:`«Еремей», — говорите вы. Мрамор отвечает низким гулом, и руны вспыхивают золотом. «Правильно, — смеётся Дух камня. — Имя — это не звук, это разрешение войти. Мастер оставил здесь не клад, а дверь. Клад ищут, а дверь открывают». В щели загорается уголь. Вы берёте его, и стены на миг становятся прозрачными, как вода.`},{id:`b`,icon:`Hand`,label:`Коснуться мраморной жилы ладонью`,response:`Камень тёплый, как живая кожа. По жиле пробегает спираль, и вы слышите далёкий удар молота. «Ты не первый, кто трогает эту стену, — говорит Дух. — Но первый, кто не отнял руку». Он вкладывает в вашу ладонь рунический уголь. «Теперь у тебя есть знак. Когда вернёшься, нарисуй его на камне у входа — и усадьба узнает тебя».`}]}]},{id:`wood`,label:`Деревянное зодчество`,shortLabel:`Зодчество`,icon:`Trees`,tagline:`Северный погост, мельница и грамота`,accent:`#2EC4B6`,archiveText:`Северный погост вырос на берегу студёной реки, где сосны помнят ещё языческие капища. Резная мельница плотника Никифора стоит без единого гвоздя: говорят, мастер вырезал на её крыле птицу-берегиню, и та указывает путь заплутавшим. В часовне хранится берестяная грамота XV века с перечнем даней и имён; нижняя строка в ней процарапана позже другой рукой. Деревенские ребятишки находят в щепе странные знаки, а старики уверяют: это Никифор переписывается с лешим. У околицы, где сходятся три тропы, стоит обетный крест и растёт рябина, которую не трогают ни птицы, ни мороз.`,curatedKeywords:[`Северный погост`,`плотник Никифор`,`резная мельница`,`берестяная грамота`,`птица-берегиня`,`три тропы`],location:`Погост «Три сосны»`,duration:46,points:[{id:`mill`,title:`Мельница плотника Никифора`,place:`Мельница на студёной реке`,x:78,y:176,character:{name:`Никифор`,role:`плотник и резчик`,archetype:`blacksmith`,quote:`Дерево держит дом, пока помнит корни. Человек — так же.`,pitch:.7,rate:.9},artifact:{id:`wood-seal`,name:`Берестяная печать`,type:`seal`,material:`Береста, дёготь, родовой штамп`,history:`Печать найдена под нижним венцом мельницы. На ней не буква, а родовой знак Никифорова рода. Такой же оттиск стоит на берестяной грамоте XV века — значит, мельница связана с переписью погоста.`,inscription:`НИКИФОР · РОД · МЕЛЬНИЦА`},scenes:nr.mill,choices:[{id:`a`,icon:`Search`,label:`Изучить птицу-берегиню на крыле`,response:`Птица вырезана так, что её глаз ловит любой свет. Никифор подходит и проводит пальцем по крылу: «Её резали в год, когда родился сын. Я хотел, чтобы она летала вместо него, если ему не хватит неба». На дереве проступает тонкая резьба — вторая птица, меньшая. «А это для того, кто придёт после. Теперь ты знаешь, где искать».`},{id:`b`,icon:`MessageCircleQuestion`,label:`Спросить, почему мельница стоит без гвоздей`,response:`«Гвоздь — это приказ, а нагель — договор, — отвечает Никифор. — Дерево должно уметь дышать, иначе оно мстит трещинами. Мельница стоит триста лет, потому что каждая её часть знает, зачем она здесь». Он достаёт берестяную печать и кладёт на ладонь: «Возьми. Это не пропуск. Это обещание вернуться».`}]},{id:`chapel`,title:`Часовня на трёх тропах`,place:`Обетный крест и рябина`,x:140,y:104,character:{name:`Северная Берегиня`,role:`хранительница дорог`,archetype:`guardian`,quote:`Лес не пугает. Он проверяет, кто пришёл — гость или хозяин.`,pitch:1.2,rate:.86},artifact:{id:`wood-ribbon`,name:`Обетная лента трёх троп`,type:`amulet`,material:`Лён, серебряная нить, рябиновая ягода`,history:`Обетная лента, висевшая на рябине у часовни. Три узла означали три дороги и три обещания. По преданию, лента указывает путь тому, кто не солгал, когда завязывал последний узел.`,inscription:`ТРИ ТРОПЫ · ТРИ ОБЕЩАНИЯ`},scenes:nr.chapel,choices:[{id:`a`,icon:`Wind`,label:`Отпустить ленту на ветер`,response:`Лента не падает. Она вытягивается в сторону рощи и дрожит, как живая. «Дорога приняла тебя, — говорит Берегиня. — Но лента запомнила твой страх. Это ничего: страх тоже умеет идти рядом, если не давать ему поводья». Она снимает третий узел и вкладывает ленту вам в руку. На ветке рябины остаётся светлый след.`},{id:`b`,icon:`Compass`,label:`Спросить, какая тропа лишняя`,response:`Берегиня поднимает фонарь. Три тропы лежат перед вами, но только две отбрасывают тени. «Третья — не дорога, а память о дороге, — говорит она. — Иди по ней, когда захочешь вернуться, но не пытайся привести туда других». Она завязывает на ленте новый узел: «Это твой. Теперь ты тоже часть обета».`}]},{id:`shop`,title:`Торговая лавка у пристани`,place:`Лавка купца Власа`,x:238,y:126,character:{name:`Влас`,role:`купец и счетовод`,archetype:`merchant`,quote:`Считай не гривны, а дороги. Дорога всегда дороже товара.`,pitch:.88,rate:.96},artifact:{id:`wood-tally`,name:`Счётная бирка Власа`,type:`ledger`,material:`Дуб, чернильный воск, льняная нить`,history:`Деревянная бирка с тремя группами зарубок — прообраз товарного чека. Одна группа нанесена позже остальных и совпадает с узлом на обетной ленте. Возможно, это не счёт, а тайная метка торгового пути.`,inscription:`СОЛЬ · МЕХ · ИМЯ`},scenes:nr.shop,choices:[{id:`a`,icon:`BookOpen`,label:`Сверить бирку с берестяной грамотой`,response:`Вы кладёте бирку рядом с копией грамоты. Третья зарубка совпадает с процарапанной строкой, но не по форме, а по направлению. Влас тихо присвистывает: «Так вот что он прятал. Не дань. Право на дорогу». Он отдаёт бирку: «Держи. Теперь ты знаешь, что здесь продавали не мех, а возможность уйти».`},{id:`b`,icon:`Coins`,label:`Спросить, кому принадлежит третья зарубка`,response:`Влас долго вертит бирку в пальцах. «Третья — за имя, — наконец говорит он. — Но имя не продаётся. Его либо помнят, либо вычёркивают». Он указывает на нижнюю строку грамоты, где соскоблено слово. «Если восстановишь его, узнаешь, кого погост хотел забыть. А это уже дороже любого товара».`}]},{id:`grove`,title:`Заповедная роща`,place:`Сосновый бор за околицей`,x:292,y:54,character:{name:`Хранитель бора`,role:`дух заповедной рощи`,archetype:`spirit`,quote:`Каждая сосна здесь выросла из чьего-то обещания. Не топчи его.`,pitch:.58,rate:.8},artifact:{id:`wood-bird`,name:`Птица-берегиня`,type:`bird`,material:`Сосна, береста, следы резца`,history:`Деревянная птица, вырезанная Никифором в год рождения сына. Висела на обетном кресте как знак исполненного обещания. Родовой знак на её крыле совпадает с оттиском берестяной печати.`,inscription:`ПТИЦА · ОБЕТ · ВОЗВРАЩЕНИЕ`},scenes:nr.grove,choices:[{id:`a`,icon:`Bird`,label:`Вернуть птицу на ветку мельницы`,response:`Птица сама перебирается на вашу ладонь и замирает. Хранитель бора кивает: «Круг замыкается не там, где начался. Ты вернёшь её не к мельнице, а к памяти о мастере». В воздухе пахнет смолой и почему-то тёплым хлебом. Деревянные крылья птицы на миг становятся живыми и мягкими.`},{id:`b`,icon:`Hand`,label:`Коснуться ствола самой старой сосны`,response:`Кора тёплая. Под ладонью проступают три зарубки, точно как на бирке. «Никифор отметил здесь начало обета, — шепчет Хранитель. — Он обещал, что роща переживёт его. Ты сейчас держишь это обещание в руке». Птица-берегиня вспыхивает золотом и становится лёгкой, как перо.`}]}]},{id:`mine`,label:`Горный парк и штольни`,shortLabel:`Горный парк`,icon:`Mountain`,tagline:`Мрамор, медная жила и подземное озеро`,accent:`#A8DADC`,archiveText:`Мраморный каньон в горном парке разрабатывали с конца XVIII века. Рудознатец Савва нашёл здесь жилу медного блеска и первым спустился в затопленную штольню, откуда не вернулся. В подземном озере вода остаётся тёплой даже зимой, а по стенкам проступают спирали, похожие на письмо. Старожилы рассказывают о Хозяине медных жил: он не любит жадных и уводит их вглубь, зато щедро одаривает тех, кто приходит с уважением. На старой вагонетке до сих пор лежит медная монета с профилем горного духа. В конторе приказчика сохранились ведомости, где одна и та же жила записана трижды под разными именами.`,curatedKeywords:[`мраморный каньон`,`рудознатец Савва`,`подземное озеро`,`Хозяин медных жил`,`медная жила`,`старая штольня`],location:`Горный парк «Медная гряда»`,duration:52,points:[{id:`adit`,title:`Штольня рудознатца Саввы`,place:`Вход в старую штольню`,x:78,y:176,character:{name:`Савва`,role:`рудознатец и горный мастер`,archetype:`blacksmith`,quote:`Под землёй нет тишины. Просто мы разучились слушать её язык.`,pitch:.68,rate:.88},artifact:{id:`mine-coin`,name:`Медная монета Хозяина`,type:`coin`,material:`Медь, патина, следы ручной чеканки`,history:`Монета с профилем, не совпадающим с известными образцами. Найдена на старой вагонетке. Возможно, это местная отливка, которой расплачивались с горняками, или оберег, который оставляли у входа в штольню.`,inscription:`МЕДЬ · ГЛУБИНА · ДОГОВОР`},scenes:rr.adit,choices:[{id:`a`,icon:`Search`,label:`Изучить крепь и знаки на стенах`,response:`На третьем венце крепи выцарапан знак — тот же, что на монете. Савва подносит фонарь ближе: «Это не метка, это подпись. Так отмечали выработки, которые нельзя бросать. Здесь осталась жила, но её закрыли не из-за пустоты». Он указывает вглубь: «Слышишь звон? Это озеро. Оно не любит, когда его ищут с киркой. Иди с пустыми руками».`},{id:`b`,icon:`Flame`,label:`Спуститься на тёплый воздух штольни`,response:`Воздух становится плотнее и теплее с каждым шагом. Савва идёт впереди, не оглядываясь. «Внизу был мой брат, — говорит он. — Я слышал его голос три дня. На четвёртый — перестал. Не потому, что он замолчал, а потому, что я перестал слушать». Фонарь гаснет на секунду. Когда он снова загорается, на стене видна стрелка, указывающая к озеру.`}]},{id:`lake`,title:`Подземное озеро`,place:`Затопленная камера`,x:140,y:104,character:{name:`Хозяйка жил`,role:`хранительница подземных вод`,archetype:`guardian`,quote:`Камень отдаёт лишь тому, кто умеет отпускать. Жадный забирает — и остаётся.`,pitch:1.18,rate:.84},artifact:{id:`mine-rune`,name:`Спираль подземной воды`,type:`rune`,material:`Известняк, медный налёт, вода`,history:`Камень со спиральным знаком, повторяющим разметку в штольне и профиль на монете. Считается, что спираль обозначала путь к подземному озеру и одновременно предупреждение: возвращаться нужно тем же путём.`,inscription:`ВОДА · СПИРАЛЬ · ПУТЬ`},scenes:rr.lake,choices:[{id:`a`,icon:`Waves`,label:`Коснуться тёплой воды ладонью`,response:`Вода тёплая, как парное молоко. По поверхности идёт круг, второй, третий — и в центре проступает отражение штольни, которой нет. «Ты видишь память места, — говорит Хозяйка. — Савва стоит у входа. Он до сих пор думает, что не дошёл. Скажи ему, что дверь открыта». Она вкладывает в вашу руку камень со спиралью.`},{id:`b`,icon:`Sparkles`,label:`Бросить в воду медную монету`,response:`Монета уходит в воду без всплеска. На миг всё озеро становится медным, и вы слышите далёкий голос: «Спасибо». Хозяйка склоняет голову: «Он ждал не монету. Он ждал, что кто-то вспомнит его имя. Теперь ты можешь идти дальше — и вода запомнит тебя как гостя, а не как вора».`}]},{id:`office`,title:`Контора приказчика`,place:`Горная контора`,x:238,y:126,character:{name:`Фома`,role:`приказчик и хранитель ведомостей`,archetype:`merchant`,quote:`Ведомость врёт аккуратнее человека. Потому её и проверяют дважды.`,pitch:.9,rate:.93},artifact:{id:`mine-ledger`,name:`Тройная ведомость`,type:`ledger`,material:`Плотная бумага, железо-галловые чернила`,history:`Документ, в котором одна и та же медная жила записана трижды под разными названиями. В нижней строке стёрто имя владельца. Ведомость датируется концом XVIII века и содержит водяной знак местной бумажной фабрики.`,inscription:`МЕДЬ · СЕРЕБРО · КАЗНА`},scenes:rr.office,choices:[{id:`a`,icon:`BookOpen`,label:`Прочитать стёртую строку на просвет`,response:`На просвет проступает имя: «Савва». Фома медленно откладывает перо. «Значит, жила была его. А я записывал её на казну, чтобы она не досталась никому». Он закрывает ведомость и протягивает вам монету: «Возьми. Это не плата. Это признание. Только не повторяй моей ошибки: не прячь имя за цифрой».`},{id:`b`,icon:`Search`,label:`Сравнить печать с монетой`,response:`Вы прикладываете монету к оттиску в нижней строке. Они совпадают, но зеркально — как ключ и замок. «Печать перевёрнута, — шепчет Фома. — Так делали, когда хотели, чтобы документ действовал только в одном направлении». Он отдаёт ведомость: «Теперь ты знаешь, куда вёл подземный ход. И почему Савва не вернулся».`}]},{id:`canyon`,title:`Мраморный каньон`,place:`Смотровая над каньоном`,x:292,y:54,character:{name:`Хозяин жил`,role:`дух медного месторождения`,archetype:`spirit`,quote:`Медь звенит, когда её тревожат. Я звеню, когда меня забывают.`,pitch:.52,rate:.76},artifact:{id:`mine-crystal`,name:`Кристалл медной жилы`,type:`crystal`,material:`Кварц, медные включения, известняк`,history:`Кристалл из расщелины каньона. Его свечение объясняется преломлением света в кварце, но местные верят, что камень загорается только рядом с теми, кто умеет видеть. Знак на породе совпадает с клеймом из штольни.`,inscription:`ЖИЛА · СВЕТ · НАСЛЕДИЕ`},scenes:rr.canyon,choices:[{id:`a`,icon:`Sparkles`,label:`Произнести имена всех мастеров`,response:`«Савва. Фома. Еремей», — говорите вы. Каньон отвечает низким звоном, и кристалл вспыхивает так ярко, что на секунду становится видно дно. Хозяин медных жил смеётся: «Вот теперь это не клад. Это наследство». Он кладёт кристалл в вашу ладонь: «Свети им, когда кто-то скажет, что история — это скучно».`},{id:`b`,icon:`Hand`,label:`Приложить ладонь к мраморной стене`,response:`Камень отзывается теплом. По нему бежит спираль, и вы слышите три голоса сразу: молот, воду и звон вагонетки. «Ты прошёл весь путь, — говорит Хозяин. — Но главное не то, что ты нашёл, а то, что теперь знаешь, кому это вернуть». Кристалл отделяется от породы и ложится вам в руку, как спелая ягода.`}]}]}],ar={manor:{slavic:`Заговорённый ключ усадьбы`,detective:`Дело о ключе с кузнечным клеймом`,merchant:`Ключ, проданный дважды`},wood:{slavic:`Мельница, которая пела`,detective:`Пропавшая берестяная грамота`,merchant:`Никифоров торг и берестяной вексель`},mine:{slavic:`Хозяин медных жил`,detective:`Штольня № 7: исчезнувший рудознатец`,merchant:`Мраморный каньон: цена подземного озера`}},or={family:`Семейная тропа с загадками, добрыми хранителями и сокровищем, которое находит каждого.`,school:`Экспедиция с историческими пасхалками, проверяемыми фактами и решениями, от которых зависит финал.`,adult:`Атмосферная дра
